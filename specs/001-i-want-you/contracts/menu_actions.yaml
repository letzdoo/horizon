openapi: 3.0.0
info:
  title: School Export Reports Menu Actions
  version: 1.0.0
  description: Menu action contracts for accessing report generation

paths:
  /web/action/load:
    post:
      summary: Load Report Menu Action
      description: Loads menu action for report generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action_id:
                  type: integer
                  description: Menu action ID for report type
                context:
                  type: object
                  properties:
                    lang:
                      type: string
                      example: "fr_FR"
                    uid:
                      type: integer
                      description: User ID
      responses:
        '200':
          description: Menu action loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "Generate Programs Report"
                  type:
                    type: string
                    enum: ["ir.actions.act_window"]
                  res_model:
                    type: string
                    enum: ["export.report"]
                  view_mode:
                    type: string
                    example: "form"
                  target:
                    type: string
                    enum: ["new", "current"]
                  context:
                    type: object
                    properties:
                      default_report_type:
                        type: string
                        enum: ["programs", "students", "teachers", "blocs"]

  /web/dataset/search_read:
    post:
      summary: Load Report History
      description: Retrieves previously generated reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  enum: ["export.report"]
                fields:
                  type: array
                  items:
                    type: string
                  example: ["name", "report_type", "generation_timestamp", "status", "record_count"]
                domain:
                  type: array
                  description: Search filters
                  example: [["report_type", "=", "programs"]]
                context:
                  type: object
      responses:
        '200':
          description: Report history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        report_type:
                          type: string
                        generation_timestamp:
                          type: string
                          format: datetime
                        status:
                          type: string
                          enum: ["pending", "success", "error"]
                        record_count:
                          type: integer
                  length:
                    type: integer