openapi: 3.0.0
info:
  title: School Export Reports API
  version: 1.0.0
  description: API contracts for generating Excel reports from CSV export data

paths:
  /web/dataset/call_kw/export.report/generate_programs_report:
    post:
      summary: Generate Programs Excel Report
      description: Creates Excel report from school_programs.csv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
                  properties:
                    model:
                      type: string
                      enum: ["export.report"]
                    method:
                      type: string
                      enum: ["generate_programs_report"]
                    args:
                      type: array
                      items:
                        type: integer
                      description: Record IDs (empty for new report)
                    kwargs:
                      type: object
                      properties:
                        context:
                          type: object
              required: ["params"]
      responses:
        '200':
          description: Report generation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      report_id:
                        type: integer
                        description: Generated report record ID
                      download_url:
                        type: string
                        description: URL to download Excel file
                      record_count:
                        type: integer
                        description: Number of records processed
                required: ["result"]
        '400':
          description: CSV validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "CSV file validation failed"
                      details:
                        type: array
                        items:
                          type: string
                        example: ["Missing required column: 'id'", "Invalid encoding detected"]
        '404':
          description: CSV file not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "CSV file not found: school_programs.csv"

  /web/dataset/call_kw/export.report/generate_students_report:
    post:
      summary: Generate Students Excel Report
      description: Creates Excel report from school_students.csv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReportGenerationSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/FileNotFound'

  /web/dataset/call_kw/export.report/generate_teachers_report:
    post:
      summary: Generate Teachers Excel Report
      description: Creates Excel report from school_teachers.csv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReportGenerationSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/FileNotFound'

  /web/dataset/call_kw/export.report/generate_blocs_report:
    post:
      summary: Generate Blocs Excel Report
      description: Creates Excel report from school_blocs.csv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReportGenerationSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/FileNotFound'

components:
  schemas:
    ReportGenerationRequest:
      type: object
      properties:
        params:
          type: object
          properties:
            model:
              type: string
              enum: ["export.report"]
            method:
              type: string
              enum: ["generate_programs_report", "generate_students_report", "generate_teachers_report", "generate_blocs_report"]
            args:
              type: array
              items:
                type: integer
              description: Record IDs (empty for new report)
            kwargs:
              type: object
              properties:
                context:
                  type: object
      required: ["params"]

  responses:
    ReportGenerationSuccess:
      description: Report generation successful
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  report_id:
                    type: integer
                    description: Generated report record ID
                  download_url:
                    type: string
                    description: URL to download Excel file
                  record_count:
                    type: integer
                    description: Number of records processed
            required: ["result"]

    ValidationError:
      description: CSV validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    example: "CSV file validation failed"
                  details:
                    type: array
                    items:
                      type: string
                    example: ["Missing required column: 'id'", "Invalid encoding detected"]

    FileNotFound:
      description: CSV file not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    example: "CSV file not found"